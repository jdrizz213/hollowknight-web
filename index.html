<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Hollow Knight Web</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
text-align:center;
}

header{
padding:20px;
font-size:40px;
background:#111;
border-bottom:2px solid #333;
}

#game-container{
width:100%;
height:90vh;
display:flex;
align-items:center;
justify-content:center;
}

canvas{
width:100%;
height:100%;
}

button{
padding:15px 30px;
font-size:18px;
background:#5c6cff;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

button:hover{
background:#3f4aff;
}

#loading{
font-size:20px;
margin-top:20px;
}

</style>
</head>

<body>

<header>
Hollow Knight Web
</header>

<div id="menu">

<button onclick="startGame()">Play Game</button>

<div id="loading"></div>

</div>

<div id="game-container" style="display:none">

<canvas id="unity-canvas"></canvas>

</div>

<script>

function startGame(){

document.getElementById("menu").style.display="none"
document.getElementById("game-container").style.display="block"

loadGame()

}

async function loadGame(){

const loading = document.getElementById("loading")

loading.innerText="Loading game..."

const loader = document.createElement("script")
loader.src="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight/Build/hk.loader.js"

document.body.appendChild(loader)

}

</script>

</body>
</html>
